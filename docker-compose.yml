services:
  greenhill:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_SECRET: local-docker-secret-change-me
      # The container must listen on all interfaces for the published port to work.
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      APP_DB_PATH: data/greenhill.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><span class="eyebrow">CATALOGUE</span><h1>{{'Edit' if product else 'Add'}} product</h1></div></div><form method="post" action="/coordinator/products/save" class="card form-card"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><input type="hidden" name="id" value="{{product.id if product else ''}}"><div class="form-grid"><label>Product name<input name="name" required value="{{product.name if product else ''}}"></label><label>Bay / location<input name="bay" value="{{product.bay if product else ''}}"></label><label>Sale type<select name="sale_type"><option value="unit" {% if product and product.sale_type=='unit' %}selected{% endif %}>Per unit</option><option value="kg" {% if product and product.sale_type=='kg' %}selected{% endif %}>Per kilogram</option></select></label><label>Price (AUD)<input name="price" type="number" min="0" step="0.01" required value="{{'%.2f'|format(product.price_cents/100) if product else ''}}"></label><label class="wide">Description<textarea name="description" rows="4">{{product.description if product else ''}}</textarea></label><label>Status<select name="active"><option value="1" {% if not product or product.active %}selected{% endif %}>Active</option><option value="0" {% if product and not product.active %}selected{% endif %}>Withdrawn</option></select></label></div><div class="form-actions"><a class="btn" href="/coordinator/products">Cancel</a><button class="btn primary">Save product</button></div></form>{% endblock %}

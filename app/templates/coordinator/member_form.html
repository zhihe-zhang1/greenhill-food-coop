{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><span class="eyebrow">MEMBERSHIP</span><h1>{{'Edit' if member else 'Add'}} member</h1></div></div><form method="post" action="/coordinator/members/save" class="card form-card"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><input type="hidden" name="id" value="{{member.id if member else ''}}"><div class="form-grid"><label>Member number<input name="member_no" required value="{{member.member_no if member else ''}}"></label><label>Name<input name="name" required value="{{member.name if member else ''}}"></label><label>Email<input type="email" name="email" required value="{{member.email if member else ''}}"></label><label>Phone<input name="phone" value="{{member.phone if member else ''}}"></label><label class="wide">Address<input name="address" value="{{member.address if member else ''}}"></label><label>Crate number<input type="number" name="crate_no" min="1" value="{{member.crate_no if member and member.crate_no else ''}}"></label><label>Status<select name="active"><option value="1" {% if not member or member.active %}selected{% endif %}>Active</option><option value="0" {% if member and not member.active %}selected{% endif %}>Inactive</option></select></label><label class="wide">Password {% if member %}<small>(leave blank to keep current password)</small>{% endif %}<input type="password" name="password"></label></div><div class="form-actions"><a class="btn" href="/coordinator/members">Cancel</a><button class="btn primary">Save member</button></div></form>{% endblock %}

name: tests

# Run once per change: pushes are only built on main (a pull request already
# builds its own head branch, so `push:` without a filter ran every commit twice).
on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run when a newer commit arrives on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run the automated test suite
        run: python -m pytest -q
      - name: Show the environment when a test fails
        if: failure()
        run: |
          python -V
          pip freeze

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployment image
        run: docker build -t greenhill-food-coop:ci .
